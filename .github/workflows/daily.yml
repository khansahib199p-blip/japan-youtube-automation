name: YouTube Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"

jobs:
  generate-script:
    runs-on: ubuntu-latest

    steps:
      - name: Generate YouTube Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -sS -f -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "contents": [{
                "parts": [{
                  "text": "Write a 2-minute YouTube video script about 5 amazing facts about Japan. Include a catchy title, a strong hook, and an engaging ending. Write in simple English."
                }]
              }]
            }' > response.json

          jq -r '.candidates[0].content.parts[0].text' response.json > japan_script.txt

      - name: Save YouTube Script
        uses: actions/upload-artifact@v4
        with:
          name: japan-youtube-script
          path: japan_script.txt
