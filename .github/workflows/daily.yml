name: YouTube Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"

jobs:
  generate-script:
    runs-on: ubuntu-latest

    steps:
      - name: Generate YouTube Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "contents": [{
                "parts": [{
                  "text": "Write a 2-minute YouTube video script about 5 amazing facts about Japan. Include a catchy title, a short introduction, 5 interesting facts, and a closing sentence. Write in simple English."
                }]
              }]
            }'
